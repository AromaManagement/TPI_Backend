services:
  postgres:
    image: postgres:16-alpine
    container_name: aromas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aromas_user
      POSTGRES_PASSWORD: aromas_pass
      POSTGRES_DB: aromas_db
    ports:
      - "5434:5432"
    volumes:
      - aromas_pgdata:/var/lib/postgresql/data

volumes:
  aromas_pgdata:
